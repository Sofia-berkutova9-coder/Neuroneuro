<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURONEURO — нейронаука без мистики</title>
<style>
:root{--bg:#17140f;--card:#221e17;--card2:#2b261d;--ink:#f2ede2;--mut:#a89f8c;--acc:#6fa8ff;--acc2:#4dd07a;--warn:#ffd84d;--bad:#ff6b6b;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:rgba(23,20,15,.94);backdrop-filter:blur(6px);border-bottom:1px solid #3a332a;z-index:50}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{font-size:20px;letter-spacing:2px;color:var(--acc);font-weight:bold;text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:15px}
nav a:hover{color:var(--ink);background:#2b261d}
nav a.on{color:var(--ink);background:#2b261d}
.langs{margin-left:auto;display:flex;gap:6px}
.langs button{background:none;border:1px solid #4a4234;color:var(--mut);padding:4px 9px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
.langs button.on{color:var(--ink);border-color:var(--acc);background:#242b38}
main{padding:28px 0 60px}
section{display:none}
section.on{display:block}
h1{font-size:34px;line-height:1.25;margin:10px 0 14px}
h2{font-size:26px;margin:6px 0 16px}
h3{font-size:19px;margin:18px 0 8px;color:var(--ink)}
p{margin:8px 0;color:#ddd5c6}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;letter-spacing:2px;color:var(--acc);border:1px solid #33405a;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.btn{display:inline-block;background:var(--acc);color:#0d1117;border:none;padding:11px 22px;border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:bold;text-decoration:none}
.btn.ghost{background:none;border:1px solid #4a4234;color:var(--ink)}
.btn:active{transform:scale(.98)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid #3a332a;border-radius:var(--r);padding:18px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.card h3{margin-top:0}
.card .num{font-size:12px;color:var(--acc);letter-spacing:1px}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;background:#2d3a24;color:var(--acc2)}
.badge.res{background:#3a3324;color:var(--warn)}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--ink);border:1px solid #3a332a;border-radius:12px;padding:13px 16px;margin:9px 0;cursor:pointer;font-size:16px;font-family:inherit}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--acc2);background:#233423}
.opt.bad{border-color:var(--bad);background:#342323}
.expl{background:#242b38;border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:12px 16px;margin:12px 0;display:none}
.expl.show{display:block}
.timer{float:right;color:var(--warn);font-size:14px}
.progress{height:4px;background:#3a332a;border-radius:3px;margin:14px 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc);transition:width .3s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:100;overflow-y:auto;padding:20px}
.modal.show{display:block}
.mbox{max-width:760px;margin:20px auto;background:var(--bg);border:1px solid #3a332a;border-radius:var(--r);padding:30px}
.mclose{position:sticky;top:0;float:right;font-size:26px;color:var(--mut);cursor:pointer;background:none;border:none;font-family:inherit}
.mapbox{position:relative;background:#1d1a14;border:1px solid #3a332a;border-radius:var(--r);height:340px;overflow:hidden}
.nmap{height:380px}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(111,168,255,.35);border:2px solid var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink);font-family:Arial}
.dot:hover{background:var(--acc)}
.dot.g{background:rgba(77,208,122,.3);border-color:var(--acc2)}
.dot.g:hover{background:var(--acc2)}
.info{background:var(--card);border:1px solid #3a332a;border-radius:var(--r);padding:16px;margin-top:14px;min-height:70px}
.slider{width:100%;margin:6px 0}
.scale{font-size:12px;color:var(--mut)}
.oq{background:var(--card);border:1px solid #3a332a;border-radius:var(--r);margin:10px 0;overflow:hidden}
.oq summary{padding:15px 18px;cursor:pointer;font-size:17px}
.oq[open] summary{border-bottom:1px solid #3a332a}
.oq .b{padding:14px 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid #3a332a;border-radius:var(--r);padding:16px;text-align:center}
.stat b{font-size:30px;color:var(--acc);display:block}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px;margin:18px 0 6px}
.bar{flex:1;background:linear-gradient(180deg,var(--acc),#2c4a77);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.bar b{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink)}
.refs a{color:var(--acc);text-decoration:none;font-size:13px}
.keys span{display:inline-block;background:#2b261d;border:1px solid #3a332a;border-radius:20px;padding:3px 12px;margin:3px 4px 0 0;font-size:13px;color:var(--mut)}
.fnote{font-size:12px;color:var(--mut);font-style:italic;margin-top:6px}
footer{border-top:1px solid #3a332a;padding:24px 0;text-align:center;color:var(--mut);font-size:13px}
.disc{background:#2d2418;border:1px solid #5a4a2a;border-radius:var(--r);padding:12px 18px;margin:20px 0;color:var(--warn);font-size:14px}
.fb{color:var(--warn);font-size:12px;margin-top:4px}
.big{font-size:42px;color:var(--acc);font-weight:bold}
</style>
</head>
<body>
<header><div class="wrap"><div class="hrow">
<a class="brand" href="#" data-nav="home">NEURONEURO</a>
<nav>
<a href="#" data-nav="home" id="n_home"></a>
<a href="#" data-nav="quiz" id="n_quiz"></a>
<a href="#" data-nav="lib" id="n_lib"></a>
<a href="#" data-nav="lab" id="n_lab"></a>
<a href="#" data-nav="open" id="n_open"></a>
<a href="#" data-nav="stats" id="n_stats"></a>
<a href="#" data-nav="about" id="n_about"></a>
</nav>
<div class="langs">
<button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="ko">KO</button><button data-l="ja">JA</button>
</div>
</div></div></header>
<main class="wrap">

<section id="home" class="on">
<span class="tag" data-i18n="hero_tag"></span>
<h1 data-i18n="hero_title"></h1>
<p data-i18n="hero_sub"></p>
<button class="btn" data-nav="quiz" data-i18n="hero_cta"></button>
<div class="disc" data-i18n="disc"></div>
</section>

<section id="quiz">
<h2 data-i18n="quiz_title"></h2>
<div class="grid g2" id="quizlist"></div>
<div id="quizrun" style="display:none"></div>
</section>

<section id="lib">
<h2 data-i18n="lib_title"></h2>
<div class="grid g2" id="artlist"></div>
</section>

<section id="lab">
<h2 data-i18n="lab_title"></h2>
<h3 data-i18n="lab_brain"></h3>
<div class="mapbox" id="brainmap"></div>
<div class="info" id="braininfo"></div>
<h3 data-i18n="lab_nerv" style="margin-top:34px"></h3>
<div class="mapbox nmap" id="nervmap"></div>
<div class="info" id="nervinfo"></div>
<h3 data-i18n="lab_stroop" style="margin-top:34px"></h3>
<p data-i18n="stroop_task"></p>

<div id="stroopbox" style="display:none;margin-top:14px">
  <div id="stword" style="font-size:46px;font-weight:bold;letter-spacing:3px;padding:20px 0"></div>
  <div id="stbtns"></div>
  <div class="mut" id="stres"></div>
</div>
<h3 data-i18n="quest_title" style="margin-top:34px"></h3>
<p class="mut" data-i18n="quest_scale"></p>
<div id="questbox"></div>
<button class="btn ghost" id="qcalc" data-i18n="quest_calc"></button>
<div id="qres" class="info" style="display:none"></div>
<p class="fnote" data-i18n="quest_note"></p>
</section>

<section id="open">
<h2 data-i18n="open_title"></h2>
<div id="openlist"></div>
</section>

<section id="stats">
<h2 data-i18n="stats_title"></h2>
<div class="stats" id="statboxes"></div>
<div class="bars" id="chart"></div>
<p class="fnote" data-i18n="stats_note"></p>
</section>

<section id="about">
<h2 data-i18n="about_title"></h2>
<p data-i18n="about_text"></p>
<div class="disc" data-i18n="disc"></div>
</section>

</main>
<footer><div class="wrap">
<div data-i18n="made"></div>
<div class="mut" id="footnote"></div>
</div></footer>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

gain": {"ru": "Пройти снова", "en": "Try again", "ko": "다시 시도", "ja": "もう一度"}, "quiz_back": {"ru": "К каталогу", "en": "Back to catalog", "ko": "목록으로", "ja": "一覧へ"}, "quiz_note": {"ru": "Это тренировка, а не аттестация: квиз не выдаёт сертификат и не оценивает вас как человека.", "en": "This is practice, not certification: the quiz issues no certificate and does not judge you as a person.", "ko": "이것은 연습이지 자격 부여가 아닙니다: 퀴즈는 인증서를 발급하지 않습니다.", "ja": "これは練習であり資格試験ではありません。証明書は発行されません。"}, "lib_title": {"ru": "Библиотека статей", "en": "Article library", "ko": "기사 라이브러리", "ja": "記事ライブラリー"}, "lib_status": {"ru": "Статус определённости", "en": "Certainty status", "ko": "확실성 상태", "ja": "確実性のステータス"}, "lib_keys": {"ru": "Ключевые понятия", "en": "Key concepts", "ko": "핵심 개념", "ja": "キー概念"}, "lib_refs": {"ru": "Научные ссылки", "en": "Scientific references", "ko": "과학 참고문헌", "ja": "科学文献"}, "lib_unknown": {"ru": "Что мы пока не понимаем", "en": "What we don't yet understand", "ko": "아직 이해하지 못하는 것", "ja": "まだ理解していないこと"}, "lib_main": {"ru": "Главная мысль", "en": "Main idea", "ko": "핵심 아이디어", "ja": "中心的な考え"}, "lab_title": {"ru": "Интерактивная лаборатория", "en": "Interactive lab", "ko": "인터랙티브 실험실", "ja": "インタラクティブラボ"}, "lab_brain": {"ru": "Brain Explorer: кликните по области", "en": "Brain Explorer: click an area", "ko": "Brain Explorer: 영역을 클릭", "ja": "Brain Explorer: 領域をクリック"}, "lab_nerv": {"ru": "Нервная система: кликните по элементу", "en": "Nervous system: click an element", "ko": "신경계: 요소를 클릭", "ja": "神経系：要素をクリック"}, "lab_why": {"ru": "Почему это важно", "en": "Why it matters", "ko": "중요한 이유", "ja": "重要な理由"}, "lab_stroop": {"ru": "Эксперимент Струпа", "en": "Stroop test", "ko": "스트룹 실험", "ja": "ストループ実験"}, "stroop_start": {"ru": "Начать эксперимент", "en": "Start test", "ko": "실험 시작", "ja": "実験開始"}, "stroop_task": {"ru": "Выберите ЦВЕТ чернил, а не значение слова", "en": "Choose the INK color, not the word's meaning", "ko": "단어의 의미가 아닌 잉크 색을 선택", "ja": "単語の意味ではなくインクの色を選択"}, "stroop_done": {"ru": "Готово! Среднее время ответа", "en": "Done! Average response time", "ko": "완료! 평균 응답 시간", "ja": "完了！平均反応時間"}, "stroop_ms": {"ru": "мс", "en": "ms", "ko": "ms", "ja": "ms"}, "stroop_again": {"ru": "Ещё раз", "en": "Again", "ko": "다시", "ja": "もう一度"}, "quest_title": {"ru": "Опросник «Узнать себя»", "en": "“Know yourself” checklist", "ko": "“나 자신을 알기” 설문", "ja": "“自分を知る”チェックリスト"}, "quest_scale": {"ru": "1 — совсем нет · 5 — полностью про меня", "en": "1 — not at all · 5 — fully about me", "ko": "1 — 전혀 아님 · 5 — 완전히 나에 대해", "ja": "1 — まったく違う · 5 — 完全に当てはまる"}, "quest_calc": {"ru": "Рассчитать", "en": "Calculate", "ko": "계산", "ja": "計算する"}, "quest_recalc": {"ru": "Пройти заново", "en": "Take again", "ko": "다시 하기", "ja": "もう一度"}, "quest_note": {"ru": "Это не диагностика и не медицинский инструмент — только самонаблюдение.", "en": "This is not a diagnosis or a medical tool — only self-observation.", "ko": "진단이나 의학적 도구가 아닙니다 — 자기 관찰일 뿐입니다.", "ja": "診断でも医療ツールでもありません — 自己観察に過ぎません。"}, "open_title": {"ru": "Открытые вопросы нейронауки", "en": "Open questions of neuroscience", "ko": "신경과학의 열린 질문", "ja": "神経科学の未解決の問い"}, "stats_title": {"ru": "Статистика проекта", "en": "Project stats", "ko": "프로젝트 통계", "ja": "プロジェクト統計"}, "stats_note": {"ru": "Данные диаграммы — демонстрационные. Реальная статистика появится после подключения сбора.", "en": "Chart data is demo data. Real statistics will appear once data collection is connected.", "ko": "차트 데이터는 데모입니다. 실제 통계는 수집 연결 후 나타납니다.", "ja": "チャートデータはデモです。実統計は収集接続後に表示されます。"}, "about_title": {"ru": "О проекте", "en": "About the project", "ko": "프로젝트 소개", "ja": "プロジェクトについて"}, "about_text": {"ru": "NEURONEURO — образовательный проект о мозге, сделанный по правилу честности: мы различаем то, что наука установила, от того, что ещё исследуется. Никакой мистики, никаких обещаний «разблокировать мозг» — только проверяемые знания и пометки о степени определённости. Проект не является медицинской рекомендацией.", "en": "NEURONEURO is an educational project about the brain built on a rule of honesty: we distinguish what science has established from what is still being researched. No mysticism, no promises to “unlock your brain” — only verifiable knowledge and certainty labels. This project is not medical advice.", "ko": "NEURONEURO는 정직성의 원칙 위에서 만들어진 뇌 교육 프로젝트입니다: 과학이 확립한 것과 아직 연구 중인 것을 구분합니다. 신비주의도, “뇌를 해방하라”는 약속도 없습니다 — 검증 가능한 지식과 확실성 표시만 있습니다. 이 프로젝트는 의학적 조언이 아닙니다.", "ja": "NEURONEUROは正直さの原則に基づく脳教育プロジェクトです：科学が確立したこととまだ研究されていることを区別します。神秘主義も「脳を解放する」約束もありません — 検証可能な知識と確実性の表示だけです。このプロジェクトは医学的助言ではありません。"}, "disc": {"ru": "Этот сайт не даёт медицинских рекомендаций. При проблемах со здоровьем обратитесь к специалисту.", "en": "This site does not provide medical advice. For health concerns, consult a specialist.", "ko": "이 사이트는 의학적 조언을 제공하지 않습니다. 건강 문제는 전문의와 상담하세요.", "ja": "このサイトは医学的助言を提供しません。健康問題は専門医に相談してください。"}, "made": {"ru": "Сделано с любовью к мозгу", "en": "Made with love for the brain", "ko": "뇌에 대한 사랑으로 제작", "ja": "脳への愛を込めて"}, "click_hint": {"ru": "Кликните по точке, чтобы узнать больше", "en": "Click a dot to learn more", "ko": "점을 클릭하여 더 알아보기", "ja": "点をクリックして詳細を確認"}, "fallback_note": {"ru": "Перевод этого материала на выбранный язык готовится — показан английский текст.", "en": "A translation of this item into the selected language is in progress — the English text is shown.", "ko": "선택한 언어로의 번역이 진행 중입니다 — 영문 텍스트가 표시됩니다.", "ja": "選択した言語への翻訳は準備中です — 英文を表示しています。"}, "nav_stats": {"ru": "Статистика", "en": "Stats", "ko": "통계", "ja": "統計"}},quiz:[{"id": "intro", "title": {"ru": "Введение в нейробиологию", "en": "Introduction to Neuroscience"}, "qs": [{"q": {"ru": "Из каких клеток в основном состоит мозг?", "en": "What cells make up most of the brain?"}, "opts": [{"ru": "Нейроны и глиальные клетки", "en": "Neurons and glial cells"}, {"ru": "Только нейроны", "en": "Neurons only"}, {"ru": "Мышечные клетки", "en": "Muscle cells"}, {"ru": "Эпителиальные клетки", "en": "Epithelial cells"}], "correct": 0, "expl": {"ru": "Мозг состоит из нейронов и глиальных клеток. Глиальных клеток даже больше, чем нейронов: они поддерживают нейроны, формируют миелин и участвуют в иммунных процессах.", "en": "The brain consists of neurons and glial cells. There are actually more glial cells than neurons: they support neurons, form myelin, and take part in immune processes."}}, {"q": {"ru": "Что такое синапс?", "en": "What is a synapse?"}, "opts": [{"ru": "Область контакта между нейронами", "en": "A junction between neurons"}, {"ru": "Часть ядра клетки", "en": "Part of the cell nucleus"}, {"ru": "Тип кровеносного сосуда", "en": "A type of blood vessel"}, {"ru": "Белковая оболочка аксона", "en": "A protein sheath of the axon"}], "correct": 0, "expl": {"ru": "Синапс — специализированная область контакта между нейронами или нейроном и другой клеткой, через которую передаётся сигнал.", "en": "A synapse is a specialized junction between neurons, or between a neuron and another cell, through which signals pass."}}, {"q": {"ru": "Какая структура играет ключевую роль в формировании эпизодических воспоминаний?", "en": "Which structure is key to forming episodic memories?"}, "opts": [{"ru": "Гиппокамп", "en": "The hippocampus"}, {"ru": "Мозжечок", "en": "The cerebellum"}, {"ru": "Спинной мозг", "en": "The spinal cord"}, {"ru": "Гипофиз", "en": "The pituitary"}], "correct": 0, "expl": {"ru": "Гиппокамп связывает компоненты опыта — образы, звуки, пространство и эмоции — в целостное эпизодическое воспоминание.", "en": "The hippocampus binds the components of an experience — images, sounds, space, emotions — into a coherent episodic memory."}}, {"q": {"ru": "Сколько примерно нейронов в человеческом мозге?", "en": "Roughly how many neurons are in the human brain?"}, "opts": [{"ru": "Около 86 миллиардов", "en": "About 86 billion"}, {"ru": "Около 86 тысяч", "en": "About 86 thousand"}, {"ru": "Около 86 миллионов", "en": "About 86 million"}, {"ru": "Около 86 триллионов", "en": "About 86 trillion"}], "correct": 0, "expl": {"ru": "Современные оценки — порядка 86 миллиардов нейронов, и сотни триллионов синаптических связей между ними.", "en": "Current estimates are around 86 billion neurons, with hundreds of trillions of synaptic connections between them."}}, {"q": {"ru": "Что такое нейропластичность?", "en": "What is neuroplasticity?"}, "opts": [{"ru": "Способность мозга меняться под влиянием опыта", "en": "The brain's ability to change in response to experience"}, {"ru": "Рост массы мозга с возрастом", "en": "Brain mass growth with age"}, {"ru": "Неизменность нервных связей", "en": "Immutability of neural connections"}, {"ru": "Свойство только клеток-инграмм", "en": "A property of engram cells only"}], "correct": 0, "expl": {"ru": "Нейропластичность — способность нейронных сетей адаптироваться под влиянием обучения, опыта и среды. Но у неё есть пределы, и она не всегда означает улучшение.", "en": "Neuroplasticity is the ability of neural networks to adapt to learning, experience and environment. But it has limits, and it does not always mean improvement."}}]}, {"id": "methods", "title": {"ru": "Методы исследования", "en": "Research methods"}, "qs": [{"q": {"ru": "Что показывает фМРТ?", "en": "What does fMRI measure?"}, "opts": [{"ru": "Косвенный показатель активности через кровоток (BOLD)", "en": "An indirect measure of activity via blood flow (BOLD)"}, {"ru": "Непосредственно мысли", "en": "Thoughts directly"}, {"ru": "Химический состав клеток", "en": "Cell chemistry"}, {"ru": "Температуру мозга", "en": "Brain temperature"}], "correct": 0, "expl": {"ru": "BOLD-сигнал отражает соотношение оксигенированного и дезоксигенированного гемоглобина. Это косвенный маркер активности, а не прямая запись мыслей.", "en": "The BOLD signal reflects the ratio of oxygenated to deoxygenated hemoglobin. It is an indirect marker of activity, not a direct readout of thoughts."}}, {"q": {"ru": "В чём сильная сторона ЭЭГ?", "en": "What is EEG's strength?"}, "opts": [{"ru": "Высокое временное разрешение — миллисекунды", "en": "High temporal resolution — milliseconds"}, {"ru": "Высокое пространственное разрешение", "en": "High spatial resolution"}, {"ru": "Видение отдельных нейронов", "en": "Seeing individual neurons"}, {"ru": "Измерение гормонов", "en": "Measuring hormones"}], "correct": 0, "expl": {"ru": "ЭЭГ отслеживает изменения электрической активности в масштабе миллисекунд, но точное расположение источника сигнала по ней определить сложно.", "en": "EEG tracks changes in electrical activity at the millisecond scale, but pinpointing the exact source of the signal is difficult."}}, {"q": {"ru": "Что регистрирует обычная МРТ?", "en": "What does standard MRI capture?"}, "opts": [{"ru": "Анатомическую структуру мозга", "en": "The brain's anatomical structure"}, {"ru": "Активность нейронов в реальном времени", "en": "Real-time neural activity"}, {"ru": "Уровень дофамина", "en": "Dopamine levels"}, {"ru": "Сновидения", "en": "Dreams"}], "correct": 0, "expl": {"ru": "МРТ использует магнитное поле и радиочастотные импульсы, чтобы показывать анатомию мозга и различать ткани.", "en": "MRI uses a magnetic field and radiofrequency pulses to show brain anatomy and distinguish tissues."}}, {"q": {"ru": "Если область активируется во время задачи, означает ли это, что она «отвечает» за эту функцию?", "en": "If an area activates during a task, does that mean it “is responsible” for that function?"}, "opts": [{"ru": "Нет — это требует осторожной интерпретации", "en": "No — this requires careful interpretation"}, {"ru": "Да, всегда", "en": "Yes, always"}, {"ru": "Да, если область яркая", "en": "Yes, if the area is bright"}, {"ru": "Да, при любом методе", "en": "Yes, with any method"}], "correct": 0, "expl": {"ru": "Одна область может участвовать в нескольких процессах, а функция может обеспечиваться распределённой сетью. Активация — не доказательство специализации.", "en": "One area can participate in several processes, and a function can be supported by a distributed network. Activation is not proof of specialization."}}]}, {"id": "memory", "title": {"ru": "Память", "en": "Memory"}, "qs": [{"q": {"ru": "Как называется процесс, при котором воспоминание после извлечения снова становится нестабильным?", "en": "What is the process called when a retrieved memory becomes unstable again?"}, "opts": [{"ru": "Реконсолидация", "en": "Reconsolidation"}, {"ru": "Кодирование", "en": "Encoding"}, {"ru": "Миелонизация", "en": "Myelination"}, {"ru": "Апоптоз", "en": "Apoptosis"}], "correct": 0, "expl": {"ru": "При извлечении воспоминание может временно стать изменяемым и пройти повторную стабилизацию — это реконсолидация.", "en": "During retrieval, a memory can temporarily become malleable and undergo restabilization — this is reconsolidation."}}, {"q": {"ru": "Что такое LTP?", "en": "What is LTP?"}, "opts": [{"ru": "Долговременное усиление синаптической передачи", "en": "Long-lasting strengthening of synaptic transmission"}, {"ru": "Уменьшение числа нейронов", "en": "Reduction of neuron count"}, {"ru": "Тип сна", "en": "A type of sleep"}, {"ru": "Гормон стресса", "en": "A stress hormone"}], "correct": 0, "expl": {"ru": "Долговременная потенциация (LTP) — усиление синаптической передачи при определённых условиях активности. Один из ключевых механизмов пластичности и памяти.", "en": "Long-term potentiation (LTP) is the strengthening of synaptic transmission under certain activity conditions. A key mechanism of plasticity and memory."}}, {"q": {"ru": "Память — это…", "en": "Memory is…"}, "opts": [{"ru": "Динамический процесс изменения нейронных связей", "en": "A dynamic process of changing neural connections"}, {"ru": "Точное хранилище файлов", "en": "An exact file store"}, {"ru": "Работа одного нейрона", "en": "The work of a single neuron"}, {"ru": "Только функция коры", "en": "A function of the cortex only"}], "correct": 0, "expl": {"ru": "Память — результат изменений в работе нейронных сетей, а не запись в отдельном «хранилище».", "en": "Memory is the result of changes in neural network operation, not a recording in a separate “storage.”"}}, {"q": {"ru": "Какая роль сна в памяти подтверждается исследованиями?", "en": "What role of sleep in memory is supported by research?"}, "opts": [{"ru": "Повторная активация нейронных представлений и стабилизация информации", "en": "Reactivation of neural representations and stabilization of information"}, {"ru": "Полное стирание дневных воспоминаний", "en": "Complete erasure of daily memories"}, {"ru": "Сон не влияет на память", "en": "Sleep has no effect on memory"}, {"ru": "Сон создаёт новые навыки из ничего", "en": "Sleep creates new skills from nothing"}], "correct": 0, "expl": {"ru": "Во время сна происходят повторная активация нейронных представлений, взаимодействия гиппокампа и коры, координация медленных колебаний, веретён сна и рипплов.", "en": "During sleep, neural representations are reactivated, hippocampal–cortical interactions occur, and slow oscillations, spindles and ripples become coordinated."}}]}, {"id": "myths", "title": {"ru": "Мифы о мозге", "en": "Brain myths"}, "qs": [{"q": {"ru": "Правда ли, что человек использует только 10% мозга?", "en": "Is it true that people use only 10% of their brain?"}, "opts": [{"ru": "Нет, это миф", "en": "No, it's a myth"}, {"ru": "Да, точно 10%", "en": "Yes, exactly 10%"}, {"ru": "Да, но только у гениев", "en": "Yes, but only geniuses"}, {"ru": "Правда после 30 лет", "en": "True after age 30"}], "correct": 0, "expl": {"ru": "Мозг работает как целостная система: практически все его области активны в течение дня. «10%» — популярный миф без научных оснований.", "en": "The brain works as an integrated system: virtually all its areas are active during the day. The “10%” is a popular myth with no scientific basis."}}, {"q": {"ru": "Правда ли, что один нейромедиатор отвечает за одну эмоцию?", "en": "Is it true that one neurotransmitter maps to one emotion?"}, "opts": [{"ru": "Нет — эффект зависит от рецептора, сети и контекста", "en": "No — the effect depends on receptors, networks and context"}, {"ru": "Да, дофамин — это только удовольствие", "en": "Yes, dopamine is only pleasure"}, {"ru": "Да, серотонин — только настроение", "en": "Yes, serotonin is only mood"}, {"ru": "Да, при условии одинаковых доз", "en": "Yes, at equal doses"}], "correct": 0, "expl": {"ru": "Один и тот же нейромедиатор может оказывать разные эффекты в разных областях мозга. Контекст важнее молекулы.", "en": "The same neurotransmitter can produce different effects in different brain areas. Context matters more than the molecule."}}, {"q": {"ru": "Правда ли, что мозг «выключается» во сне?", "en": "Is it true that the brain “switches off” during sleep?"}, "opts": [{"ru": "Нет — сон активный физиологический процесс", "en": "No — sleep is an active physiological process"}, {"ru": "Да, мозг спит вместе с нами", "en": "Yes, the brain sleeps with us"}, {"ru": "Только глубокий сон выключает мозг", "en": "Only deep sleep switches the brain off"}, {"ru": "Мозг работает только в REM", "en": "The brain works only in REM"}], "correct": 0, "expl": {"ru": "Во сне мозг демонстрирует сложную электрическую и химическую активность и участвует в консолидации памяти.", "en": "During sleep the brain shows complex electrical and chemical activity and takes part in memory consolidation."}}, {"q": {"ru": "Правда ли, что фМРТ показывает мысли человека напрямую?", "en": "Is it true that fMRI shows a person's thoughts directly?"}, "opts": [{"ru": "Нет — это косвенный гемодинамический сигнал", "en": "No — it is an indirect hemodynamic signal"}, {"ru": "Да, цветные области = мысли", "en": "Yes, colored areas = thoughts"}, {"ru": "Да, при высокой мощности", "en": "Yes, at high power"}, {"ru": "Да, с ИИ-декодером всегда", "en": "Yes, always with an AI decoder"}], "correct": 0, "expl": {"ru": "BOLD-сигнал — косвенный показатель нейронной активности. Цветная область не означает, что учёные увидели мысль.", "en": "The BOLD signal is an indirect measure of neural activity. A colored area does not mean scientists saw a thought."}}]}, {"id": "sleepstress", "title": {"ru": "Сон и стресс", "en": "Sleep and stress"}, "qs": [{"q": {"ru": "Что выделяет гипоталамус первым шагом стрессового ответа?", "en": "What does the hypothalamus release first in the stress response?"}, "opts": [{"ru": "CRH", "en": "CRH"}, {"ru": "Кортизол", "en": "Cortisol"}, {"ru": "ACTH", "en": "ACTH"}, {"ru": "Дофамин", "en": "Dopamine"}], "correct": 0, "expl": {"ru": "Последовательность HPA-оси: гипоталамус → CRH, гипофиз → ACTH, кора надпочечников → кортизол.", "en": "The HPA axis sequence: hypothalamus → CRH, pituitary → ACTH, adrenal cortex → cortisol."}}, {"q": {"ru": "Кортизол — это…", "en": "Cortisol is…"}, "opts": [{"ru": "Не исключительно «плохой гормон» — он нужен для адаптации", "en": "Not exclusively a “bad hormone” — it is needed for adaptation"}, {"ru": "Только вредный гормон", "en": "Only a harmful hormone"}, {"ru": "Нейромедиатор сна", "en": "A sleep neurotransmitter"}, {"ru": "Тип рецептора", "en": "A type of receptor"}], "correct": 0, "expl": {"ru": "В нормальных условиях кортизол необходим для адаптации организма. Проблемы возникают при интенсивном или продолжительном стрессе.", "en": "Under normal conditions cortisol is necessary for adaptation. Problems arise with intense or prolonged stress."}}, {"q": {"ru": "С каким типом сна чаще связывают яркие сновидения?", "en": "Which sleep type is most often linked to vivid dreams?"}, "opts": [{"ru": "REM", "en": "REM"}, {"ru": "Глубокий NREM", "en": "Deep NREM"}, {"ru": "Дремота", "en": "Drowsiness"}, {"ru": "Медленные колебания", "en": "Slow oscillations"}], "correct": 0, "expl": {"ru": "Яркие сновидения часто связывают с REM-сном, хотя сны могут возникать и в других стадиях.", "en": "Vivid dreams are often linked to REM sleep, though dreams can occur in other stages too."}}, {"q": {"ru": "Какая структура особенно чувствительна к сильному стрессу?", "en": "Which structure is especially sensitive to strong stress?"}, "opts": [{"ru": "Префронтальная кора", "en": "The prefrontal cortex"}, {"ru": "Мозжечок", "en": "The cerebellum"}, {"ru": "Спинной мозг", "en": "The spinal cord"}, {"ru": "Сетчатка", "en": "The retina"}], "correct": 0, "expl": {"ru": "Префронтальная кора чувствительна к нейрохимическим изменениям: стресс может нарушать рабочую память и когнитивный контроль.", "en": "The prefrontal cortex is sensitive to neurochemical changes: stress can impair working memory and cognitive control."}}]}],lab:{"brain": [{"id": "pf", "x": 22, "y": 18, "n": {"ru": "Префронтальная кора", "en": "Prefrontal cortex"}, "d": {"ru": "Планирование, контроль поведения, рабочая память, регуляция эмоций.", "en": "Planning, behavioral control, working memory, emotion regulation."}, "w": {"ru": "Именно она сильнее всего страдает при сильном стрессе — поэтому под давлением сложнее думать.", "en": "It is hit hardest by strong stress — that is why thinking gets harder under pressure."}}, {"id": "mcc", "x": 38, "y": 16, "n": {"ru": "Премоторная кора", "en": "Premotor cortex"}, "d": {"ru": "Подготовка движений и их координация перед выполнением.", "en": "Prepares and coordinates movements before execution."}, "w": {"ru": "Мост между намерением и действием.", "en": "The bridge between intention and action."}}, {"id": "m1", "x": 48, "y": 14, "n": {"ru": "Первичная моторная кора", "en": "Primary motor cortex"}, "d": {"ru": "Запускает произвольные движения тела.", "en": "Initiates voluntary body movements."}, "w": {"ru": "Карта тела в коре: чем точнее движение, тем больше представительство.", "en": "A cortical map of the body: the finer the movement, the more representation."}}, {"id": "s1", "x": 54, "y": 22, "n": {"ru": "Соматосенсорная кора", "en": "Somatosensory cortex"}, "d": {"ru": "Обрабатывает осязание, давление, температуру и положение тела.", "en": "Processes touch, pressure, temperature, and body position."}, "w": {"ru": "Здесь тело «картируется» в сознание.", "en": "Here the body is “mapped” into consciousness."}}, {"id": "par", "x": 70, "y": 26, "n": {"ru": "Теменная доля", "en": "Parietal lobe"}, "d": {"ru": "Пространственная навигация, интеграция сенсорной информации.", "en": "Spatial navigation, integration of sensory information."}, "w": {"ru": "Помогает понимать, где вы находитесь и как части тела расположены в пространстве.", "en": "Helps you understand where you are and how body parts are positioned in space."}}, {"id": "occ", "x": 86, "y": 40, "n": {"ru": "Зрительная кора", "en": "Visual cortex"}, "d": {"ru": "Обрабатывает зрительные сигналы от сетчатки: формы, движение, цвет.", "en": "Processes visual signals from the retina: shapes, motion, color."}, "w": {"ru": "Почти треть коры занимается зрением — это главная сенсорная система человека.", "en": "Almost a third of the cortex handles vision — humans' dominant sensory system."}}, {"id": "bro", "x": 26, "y": 44, "n": {"ru": "Зона Брока", "en": "Broca's area"}, "d": {"ru": "Производство речи и грамматика.", "en": "Speech production and grammar."}, "w": {"ru": "Если её нарушить, человек понимает речь, но с трудом говорит сам.", "en": "If damaged, a person understands speech but struggles to speak."}}, {"id": "tem", "x": 64, "y": 52, "n": {"ru": "Височная доля", "en": "Temporal lobe"}, "d": {"ru": "Слух, распознавание звуков и слов, часть обработки памяти.", "en": "Hearing, sound and word recognition, part of memory processing."}, "w": {"ru": "Здесь звук становится значением.", "en": "This is where sound becomes meaning."}}, {"id": "hpc", "x": 50, "y": 56, "n": {"ru": "Гиппокамп", "en": "Hippocampus"}, "d": {"ru": "Связывает компоненты опыта в эпизодические воспоминания; критичен для памяти.", "en": "Binds experience components into episodic memories; critical for memory."}, "w": {"ru": "Без него новая память не формируется — как у пациента Г.М.", "en": "Without it, no new memories form — as with patient H.M."}}, {"id": "amy", "x": 44, "y": 60, "n": {"ru": "Миндалина", "en": "Amygdala"}, "d": {"ru": "Обработка эмоциональной значимости, обучение на основе угроз.", "en": "Processes emotional significance and threat-based learning."}, "w": {"ru": "Быстрее сознания помечает стимул как «опасно».", "en": "Marks a stimulus as “dangerous” faster than conscious awareness."}}, {"id": "cere", "x": 44, "y": 82, "n": {"ru": "Мозжечок", "en": "Cerebellum"}, "d": {"ru": "Точность движений, равновесие, координация.", "en": "Movement precision, balance, coordination."}, "w": {"ru": "Содержит больше половины всех нейронов мозга при 10% объёма.", "en": "Contains more than half of all brain neurons in only 10% of its volume."}}, {"id": "stem", "x": 50, "y": 92, "n": {"ru": "Ствол мозга", "en": "Brainstem"}, "d": {"ru": "Дыхание, сердечный ритм, циклы сна и бодрствования.", "en": "Breathing, heart rhythm, sleep–wake cycles."}, "w": {"ru": "Древнейшая часть мозга: без неё жизнь невозможна.", "en": "The brain's oldest part: life is impossible without it."}}], "nerv": [{"id": "brain", "x": 50, "y": 8, "n": {"ru": "Головной мозг", "en": "Brain"}, "d": {"ru": "Центральный процессор: мышление, память, эмоции, управление телом.", "en": "The central processor: thinking, memory, emotions, body control."}}, {"id": "spinal", "x": 50, "y": 38, "n": {"ru": "Спинной мозг", "en": "Spinal cord"}, "d": {"ru": "Магистраль между мозгом и телом; собственные рефлексы.", "en": "The highway between brain and body; houses its own reflexes."}}, {"id": "soma", "x": 50, "y": 66, "n": {"ru": "Соматическая система", "en": "Somatic system"}, "d": {"ru": "Управляет произвольными движениями и передаёт ощущения от тела.", "en": "Controls voluntary movements and carries sensations from the body."}}, {"id": "auto", "x": 30, "y": 55, "n": {"ru": "Автономная система", "en": "Autonomic system"}, "d": {"ru": "Работает без сознания: сердце, дыхание, пищеварение.", "en": "Works without consciousness: heart, breathing, digestion."}}, {"id": "sym", "x": 22, "y": 47, "n": {"ru": "Симпатический отдел", "en": "Sympathetic division"}, "d": {"ru": "«Бей или беги»: мобилизация при угрозе.", "en": "“Fight or flight”: mobilization under threat."}}, {"id": "para", "x": 74, "y": 47, "n": {"ru": "Парасимпатический отдел", "en": "Parasympathetic division"}, "d": {"ru": "«Отдыхай и переваривай»: восстановление и покой.", "en": "“Rest and digest”: recovery and calm."}}, {"id": "nerve", "x": 28, "y": 72, "n": {"ru": "Периферические нервы", "en": "Peripheral nerves"}, "d": {"ru": "Доставляют сигналы к мышцам и от органов чувств.", "en": "Carry signals to muscles and from the senses."}}, {"id": "enteric", "x": 70, "y": 72, "n": {"ru": "Кишечная нервная система", "en": "Enteric nervous system"}, "d": {"ru": "«Второй мозг» в кишечнике: ~500 млн нейронов.", "en": "A “second brain” in the gut: about 500 million neurons."}}], "quest": [{"s": {"ru": "Мне трудно переключиться с тревожных мыслей на дела", "en": "It's hard for me to switch from anxious thoughts to tasks"}, "rev": false}, {"s": {"ru": "Я замечаю, где в теле живёт моё напряжение", "en": "I notice where my tension lives in my body"}, "rev": true}, {"s": {"ru": "В стрессе я сначала реагирую, а потом думаю", "en": "Under stress I react first and think later"}, "rev": false}, {"s": {"ru": "Я умею называть свои эмоции словами", "en": "I can name my emotions in words"}, "rev": true}, {"s": {"ru": "Ночные мысли мешают мне засыпать", "en": "Nighttime thoughts keep me from falling asleep"}, "rev": false}, {"s": {"ru": "Я замечаю эффект своих ожиданий на восприятие", "en": "I notice how my expectations shape my perception"}, "rev": true}, {"s": {"ru": "Мне сложно просить о помощи", "en": "It's hard for me to ask for help"}, "rev": false}, {"s": {"ru": "После нагрузки я умею восстанавливаться", "en": "After strain I know how to recover"}, "rev": true}, {"s": {"ru": "Я избегаю трудных разговоров", "en": "I avoid difficult conversations"}, "rev": false}, {"s": {"ru": "Я понимаю, что чувствует, глядя на меня собеседник", "en": "I understand what a conversation partner feels looking at me"}, "rev": true}], "quest_res": [{"n": {"ru": "Высокая саморегуляция", "en": "High self-regulation"}, "d": {"ru": "Похоже, у вас хорошо развиты навыки осознавания и восстановления. Это не диагностика — это тренированное зеркало.", "en": "It looks like your awareness and recovery skills are well developed. This is not a diagnosis — it is a trained mirror."}}, {"n": {"ru": "Средняя зона", "en": "Middle zone"}, "d": {"ru": "У вас есть рабочие механизмы саморегуляции, но часть нагрузок вы «запираете» внутри. Это нормальная зона большинства.", "en": "You have working self-regulation mechanisms, but you “lock away” part of your load. This is the normal zone for most people."}}, {"n": {"ru": "Нагрузка заметна", "en": "Noticeable load"}, "d": {"ru": "Похоже, нагрузки превышают ваши ресурсы восстановления. Это не приговор и не диагноз — но повод снизить темп и позаботиться о себе.", "en": "It looks like the load exceeds your recovery resources. This is not a verdict or a diagnosis — but a reason to slow down and take care of yourself."}}], "openq": [{"t": {"ru": "Как мозг решает, что запоминать?", "en": "How does the brain decide what to remember?"}, "d": {"ru": "Почему одни события отпечатываются мгновенно, а другие исчезают, даже если вы старались их запомнить?", "en": "Why do some events imprint instantly while others vanish even when you tried to remember them?"}}, {"t": {"ru": "Откуда берётся субъективное «я»?", "en": "Where does the subjective “self” come from?"}, "d": {"ru": "Мозг из миллиардов клеток создаёт ощущение единого наблюдателя. Как это возможно?", "en": "A brain of billions of cells creates the sense of a single observer. How is this possible?"}}, {"t": {"ru": "Почему мы видим сны именно такими?", "en": "Why are dreams the way they are?"}, "d": {"ru": "Нет теории, которая объяснила бы сюжет, эмоции и причудливую логику сновидений.", "en": "No theory yet explains the plot, emotions, and strange logic of dreams."}}, {"t": {"ru": "Может ли сознание быть вычислением?", "en": "Can consciousness be computation?"}, "d": {"ru": "Если мозг — физическая система, достаточно ли вычислений, чтобы породить переживание?", "en": "If the brain is a physical system, is computation enough to give rise to experience?"}}, {"t": {"ru": "Как мозг объединяет то, что мы видим, слышим и чувствуем?", "en": "How does the brain bind what we see, hear and feel?"}, "d": {"ru": "Проблема связанности: разные процессы дают единую картину мира. Механизм неизвестен.", "en": "The binding problem: separate processes yield one unified picture of the world. The mechanism is unknown."}}, {"t": {"ru": "Почему восприятие у всех разное?", "en": "Why is perception different for everyone?"}, "d": {"ru": "Одинаковые стимулы дают разные переживания. Мозг строит индивидуальную модель реальности.", "en": "Identical stimuli produce different experiences. The brain builds an individual model of reality."}}]},art:[{"id": "memory", "num": "01", "tag": "MEMORY", "ru": {"title": "Как мозг создаёт воспоминания", "question": "Как мозг превращает пережитый опыт в воспоминания?", "lead": "Представь: ты впервые попадаешь в незнакомый город. Замечаешь архитектуру, слышишь уличные звуки, запоминаешь дорогу.", "sections": [{"h": "Не хранилище, а процесс", "p": ["У мозга нет отдельного хранилища, в котором лежат воспоминания, как файлы на компьютере. Память — это результат изменений в работе нейронных сетей."]}, {"h": "От опыта к нейронному следу", "p": ["Формирование воспоминания можно условно разделить на три процесса.", "1. Кодирование (encoding). Когда мы воспринимаем новую информацию, активируются определённые группы нейронов. Разные области мозга обрабатывают разные характеристики опыта: зрительные образы, звуки, пространственную информацию и эмоциональное значение. Гиппокамп играет важную роль в связывании этих компонентов в целостное эпизодическое воспоминание.", "2. Консолидация (consolidation). Сразу после формирования воспоминание ещё нестабильно. Для его дальнейшего сохранения происходят изменения на уровне синапсов и нейронных сетей. Один из ключевых механизмов — синаптическая пластичность: изменение эффективности передачи сигнала между нейронами. Особенно известен механизм долговременной потенциации (LTP), при котором определённые условия активности приводят к усилению синаптической передачи.", "3. Извлечение (retrieval). Воспоминание не просто извлекается из неизменного хранилища. При воспроизведении вновь активируются связанные с ним нейронные сети. Иногда извлечённое воспоминание может стать временно изменяемым и пройти повторную стабилизацию — процесс, известный как реконсолидация."]}, {"h": "Почему сон связан с памятью?", "p": ["Во время сна мозг не просто отключается от внешнего мира. Исследования показывают, что во время определённых стадий сна происходит повторная активация некоторых нейронных представлений. Важную роль играют взаимодействия гиппокампа и коры, а также согласованная активность медленных колебаний, веретён сна и гиппокампальных рипплов.", "Это помогает стабилизировать недавно полученную информацию и интегрировать её в уже существующие знания. При этом разные стадии сна могут участвовать в различных аспектах обработки памяти."]}], "unknown": ["как именно воспоминания перераспределяются между областями мозга", "почему одни детали сохраняются, а другие теряются", "каким образом мозг определяет, какую информацию стоит сохранить"], "main": "Память — не запись прошлого, а динамический процесс изменения нейронных связей.", "keys": ["Гиппокамп", "Кодирование", "Консолидация", "Извлечение", "LTP", "Реконсолидация", "Инграмма"], "refs": [{"a": "Lutz N.D., Harkott M., Born J. (2026). Contribution of sleep to memory formation.", "j": "Physiological Reviews", "doi": "10.1152/physrev.00054.2024"}, {"a": "Tonegawa S. et al. (2018). The role of engram cells in the systemic consolidation of memory.", "j": "Nature Reviews Neuroscience", "doi": "10.1038/s41583-018-0031-2"}, {"a": "Citri A., Malenka R.C. (2008). Synaptic plasticity: multiple forms, functions, and mechanisms.", "j": "Neuropsychopharmacology", "doi": "10.1038/sj.npp.1301559"}], "status": "установлено с уточнениями"}, "en": {"title": "How the brain creates memories", "question": "How does the brain turn lived experience into memories?", "lead": "Imagine visiting an unfamiliar city for the first time. You notice the architecture, hear street sounds, and memorize your route.", "sections": [{"h": "Not a warehouse, but a process", "p": ["The brain has no separate storage where memories sit like files on a computer. Memory is the result of changes in how neural networks operate."]}, {"h": "From experience to neural trace", "p": ["Memory formation can be roughly divided into three processes.", "1. Encoding. When we perceive new information, specific groups of neurons activate. Different brain areas process different features of the experience: visual images, sounds, spatial information, and emotional significance. The hippocampus plays a key role in binding these components into a coherent episodic memory.", "2. Consolidation. Right after formation, a memory is still unstable. Its long-term preservation involves changes at the level of synapses and neural networks. A key mechanism is synaptic plasticity — changes in the efficiency of signal transmission between neurons. The best-known mechanism is long-term potentiation (LTP), where certain patterns of activity strengthen synaptic transmission.", "3. Retrieval. A memory is not simply pulled out of an unchanged store. During recall, the associated neural networks activate again. Sometimes a retrieved memory becomes temporarily malleable and undergoes restabilization — a process known as reconsolidation."]}, {"h": "Why is sleep linked to memory?", "p": ["During sleep the brain does not simply switch off from the world. Research shows that during certain sleep stages some neural representations are reactivated. Interactions between the hippocampus and cortex matter, as does the coordinated activity of slow oscillations, sleep spindles, and hippocampal ripples.", "This helps stabilize recently acquired information and integrate it into existing knowledge. Different sleep stages may contribute to different aspects of memory processing."]}], "unknown": ["how exactly memories are redistributed between brain areas", "why some details persist while others are lost", "how the brain decides which information is worth keeping"], "main": "Memory is not a recording of the past but a dynamic process of changing neural connections.", "keys": ["Hippocampus", "Encoding", "Consolidation", "Retrieval", "LTP", "Reconsolidation", "Engram"], "refs": [{"a": "Lutz N.D., Harkott M., Born J. (2026). Contribution of sleep to memory formation.", "j": "Physiological Reviews", "doi": "10.1152/physrev.00054.2024"}, {"a": "Tonegawa S. et al. (2018). The role of engram cells in the systemic consolidation of memory.", "j": "Nature Reviews Neuroscience", "doi": "10.1038/s41583-018-0031-2"}, {"a": "Citri A., Malenka R.C. (2008). Synaptic plasticity: multiple forms, functions, and mechanisms.", "j": "Neuropsychopharmacology", "doi": "10.1038/sj.npp.1301559"}], "status": "established with refinements"}}, {"id": "sleep", "num": "02", "tag": "SLEEP & DREAMS", "ru": {"title": "Что происходит с мозгом, пока вы спите", "question": "Почему мозг продолжает работать, когда мы спим?", "lead": "Сон кажется состоянием покоя. Мы закрываем глаза, перестаём взаимодействовать с окружающим миром, а сознательное восприятие меняется. Но мозг в это время продолжает демонстрировать сложную электрическую и химическую активность.", "sections": [{"h": "Сон — не выключение мозга", "p": ["Это особое физиологическое состояние, в котором меняется организация его работы."]}, {"h": "Два основных состояния сна", "p": ["В течение ночи мозг неоднократно проходит через два основных типа сна.", "NREM — сон без быстрых движений глаз. Он включает несколько стадий, от лёгкого сна до глубокого медленноволнового сна. Для глубокого NREM характерны медленные колебания электрической активности мозга. Важное событие этого периода — взаимодействие нейронных сетей гиппокампа и коры, которое связывают с консолидацией воспоминаний.", "REM — сон с быстрыми движениями глаз. В этой фазе мозговая активность по некоторым характеристикам напоминает бодрствование. Часто именно с REM-сном связывают яркие сновидения, хотя сны могут возникать и в других стадиях."]}, {"h": "Почему нам снятся сны?", "p": ["Сновидения — субъективный опыт, возникающий во время сна. Они могут включать воспоминания, эмоции, необычные ассоциации и события, которые никогда не происходили.", "Одна из гипотез предполагает, что сновидения связаны с переработкой информации и взаимодействием различных элементов памяти. Однако было бы неправильно утверждать, что каждый сон имеет определённое психологическое значение или что мозг специально создаёт сновидения для решения конкретной проблемы.", "Мы пока не располагаем единой теорией, объясняющей все особенности сновидений."]}, {"h": "Сон и память", "p": ["Во время сна некоторые недавно активированные нейронные представления могут повторно воспроизводиться. Это рассматривается как часть процесса консолидации памяти. Особенно активно изучается координация медленных колебаний коры, веретён сна и гиппокампальных рипплов.", "Но роль отдельных стадий сна остаётся предметом исследований: механизмы NREM изучены лучше, чем вклад REM в различные типы памяти."]}], "unknown": ["почему мы видим именно такие сновидения", "как мозг создаёт субъективное ощущение присутствия в вымышленном мире", "как соотносятся сновидения, эмоции и консолидация памяти"], "main": "Сон — активный процесс, в котором мозг перестраивает взаимодействие нейронных сетей и участвует в обработке полученной информации.", "keys": ["NREM", "REM-фаза", "Циркадный ритм", "Веретёна сна", "Медленные колебания", "Консолидация памяти"], "refs": [{"a": "Scammell T.E., Arrigoni E., Lipton J.O. (2017). Neural circuitry of wakefulness and sleep.", "j": "Neuron", "doi": "10.1016/j.neuron.2017.01.014"}, {"a": "Klinzing J.G., Niethard N., Born J. (2019). Mechanisms of systems memory consolidation during sleep.", "j": "Nature Neuroscience", "doi": "10.1038/s41593-019-0467-3"}, {"a": "Lutz N.D. et al. (2026). Contribution of sleep to memory formation.", "j": "Physiological Reviews", "doi": "10.1152/physrev.00054.2024"}], "status": "установлено с уточнениями"}, "en": {"title": "What happens to your brain while you sleep", "question": "Why does the brain keep working when we sleep?", "lead": "Sleep feels like a state of rest. We close our eyes, stop engaging with the world, and conscious perception changes. Yet the brain keeps showing complex electrical and chemical activity.", "sections": [{"h": "Sleep is not the brain switching off", "p": ["It is a special physiological state in which the organization of its work changes."]}, {"h": "Two main sleep states", "p": ["During the night the brain cycles repeatedly through two main types of sleep.", "NREM — sleep without rapid eye movements. It includes several stages, from light sleep to deep slow-wave sleep. Deep NREM is marked by slow oscillations of electrical activity. A key event of this period is the interaction between hippocampal and cortical networks, which is linked to memory consolidation.", "REM — sleep with rapid eye movements. In this phase brain activity resembles wakefulness in some characteristics. Vivid dreams are often linked to REM sleep, though dreams can occur in other stages too."]}, {"h": "Why do we dream?", "p": ["Dreams are subjective experiences that occur during sleep. They can include memories, emotions, unusual associations, and events that never happened.", "One hypothesis links dreaming to information processing and the interaction of memory elements. But it would be wrong to claim that every dream has a fixed psychological meaning or that the brain deliberately creates dreams to solve specific problems.", "There is no single theory yet that explains all features of dreams."]}, {"h": "Sleep and memory", "p": ["During sleep, some recently activated neural representations may be replayed. This is seen as part of memory consolidation. The coordination of cortical slow oscillations, sleep spindles, and hippocampal ripples is studied especially actively.", "But the role of individual sleep stages remains under investigation: NREM mechanisms are better understood than REM's contribution to different types of memory."]}], "unknown": ["why we dream exactly what we dream", "how the brain creates the subjective sense of being present in an imagined world", "how dreams, emotions and memory consolidation relate"], "main": "Sleep is an active process in which the brain reorganizes neural networks and processes incoming information.", "keys": ["NREM", "REM stage", "Circadian rhythm", "Sleep spindles", "Slow oscillations", "Memory consolidation"], "refs": [{"a": "Scammell T.E., Arrigoni E., Lipton J.O. (2017). Neural circuitry of wakefulness and sleep.", "j": "Neuron", "doi": "10.1016/j.neuron.2017.01.014"}, {"a": "Klinzing J.G., Niethard N., Born J. (2019). Mechanisms of systems memory consolidation during sleep.", "j": "Nature Neuroscience", "doi": "10.1038/s41593-019-0467-3"}, {"a": "Lutz N.D. et al. (2026). Contribution of sleep to memory formation.", "j": "Physiological Reviews", "doi": "10.1152/physrev.00054.2024"}], "status": "established with refinements"}}, {"id": "stress", "num": "03", "tag": "EMOTIONS & STRESS", "ru": {"title": "Нейробиология стресса: почему мозг меняется под давлением", "question": "Что происходит с мозгом, когда мы испытываем стресс?", "lead": "У тебя приближается важный экзамен. Ты знаешь материал, но внезапно становится сложнее сосредоточиться. Мысли ускоряются, внимание переключается на возможные ошибки, а привычные задачи требуют больше усилий.", "sections": [{"h": "Почему стресс способен влиять на мышление?", "p": ["Ответ связан с взаимодействием нескольких нейронных систем и гормональных механизмов."]}, {"h": "Мозг оценивает угрозу", "p": ["В обработке эмоционально значимой информации участвуют разные области мозга.", "Миндалина (amygdala) — группа ядер, участвующая в обработке эмоциональной значимости стимулов, обучении на основе угроз и формировании эмоциональных реакций.", "Префронтальная кора (prefrontal cortex) — участвует в планировании, контроле поведения, рабочей памяти и регуляции эмоциональных реакций.", "Гиппокамп (hippocampus) — участвует в формировании контекстуальной памяти и взаимодействует с системами стрессовой регуляции.", "Важно: ни одна из этих структур не работает изолированно. Эмоции возникают благодаря взаимодействию распределённых сетей."]}, {"h": "HPA axis: гормональная система стрессового ответа", "p": ["Один из основных механизмов длительной стрессовой реакции — гипоталамо-гипофизарно-надпочечниковая ось (HPA axis).", "Последовательность выглядит следующим образом: 1. Гипоталамус выделяет CRH. 2. Гипофиз отвечает выделением ACTH. 3. Кора надпочечников выделяет кортизол.", "Кортизол влияет на множество физиологических процессов, включая энергетический обмен, иммунную систему и работу мозга. Он не является исключительно «плохим гормоном». В нормальных условиях кортизол необходим для адаптации организма."]}, {"h": "Почему при сильном стрессе сложнее думать?", "p": ["Префронтальная кора особенно чувствительна к изменениям нейрохимической среды. Исследования показывают, что интенсивный или продолжительный стресс может нарушать процессы, необходимые для эффективной работы префронтальной коры, включая рабочую память и когнитивный контроль.", "Это не означает, что стресс всегда ухудшает мышление. Кратковременная реакция может мобилизовать организм, а влияние зависит от интенсивности, продолжительности и индивидуальных особенностей."]}], "unknown": ["почему люди по-разному реагируют на одинаковые стрессоры", "как мозг адаптируется к повторяющимся нагрузкам", "почему последствия длительного стресса различаются у разных людей"], "main": "Стресс — это не просто эмоция. Это комплексная нейробиологическая реакция, в которой взаимодействуют мозговые сети, гормоны и автономная нервная система.", "keys": ["Миндалина", "Префронтальная кора", "Гиппокамп", "Ось HPA", "Кортизол", "Реакция на стресс"], "refs": [{"a": "McEwen B.S. (2007). Physiology and neurobiology of stress and adaptation.", "j": "Physiological Reviews", "doi": "10.1152/physrev.00041.2006"}, {"a": "Tricoire L., Sabatini B.L. (2012). GABAergic signaling in the developing brain.", "j": "Nature Reviews Neuroscience", "doi": "10.1038/nrn2648"}], "status": "установлено с уточнениями"}, "en": {"title": "The neuroscience of stress: how pressure changes the brain", "question": "What happens in the brain when we feel stress?", "lead": "An important exam is coming up. You know the material, but suddenly it gets harder to focus. Thoughts speed up, attention shifts to possible mistakes, and routine tasks take more effort.", "sections": [{"h": "Why can stress affect thinking?", "p": ["The answer involves the interplay of several neural systems and hormonal mechanisms."]}, {"h": "The brain evaluates threat", "p": ["Different brain areas take part in processing emotionally significant information.", "The amygdala — a group of nuclei involved in processing the emotional significance of stimuli, threat-based learning, and forming emotional responses.", "The prefrontal cortex — involved in planning, behavioral control, working memory, and regulating emotional responses.", "The hippocampus — involved in forming contextual memory and interacts with stress-regulation systems.", "Important: none of these structures works in isolation. Emotions emerge from the interaction of distributed networks."]}, {"h": "The HPA axis: the hormonal stress-response system", "p": ["One of the main mechanisms of the prolonged stress response is the hypothalamic–pituitary–adrenal (HPA) axis.", "The sequence: 1. The hypothalamus releases CRH. 2. The pituitary responds by releasing ACTH. 3. The adrenal cortex releases cortisol.", "Cortisol affects many physiological processes, including energy metabolism, the immune system, and brain function. It is not exclusively a “bad hormone.” Under normal conditions cortisol is necessary for adaptation."]}, {"h": "Why is it harder to think under strong stress?", "p": ["The prefrontal cortex is especially sensitive to changes in the neurochemical environment. Research shows that intense or prolonged stress can disrupt the processes needed for effective prefrontal function, including working memory and cognitive control.", "This does not mean stress always impairs thinking. A short-term response can mobilize the body, and the effect depends on intensity, duration, and individual differences."]}], "unknown": ["why people respond differently to the same stressors", "how the brain adapts to repeated load", "why the consequences of chronic stress differ between people"], "main": "Stress is not just an emotion. It is a complex neurobiological response involving brain networks, hormones, and the autonomic nervous system.", "keys": ["Amygdala", "Prefrontal cortex", "Hippocampus", "HPA axis", "Cortisol", "Stress response"], "refs": [{"a": "McEwen B.S. (2007). Physiology and neurobiology of stress and adaptation.", "j": "Physiological Reviews", "doi": "10.1152/physrev.00041.2006"}, {"a": "Arnsten A.F.T. (2009). Stress signalling pathways that impair prefrontal cortex structure and function.", "j": "Nature Reviews Neuroscience", "doi": "10.1038/nrn2648"}], "status": "established with refinements"}}, {"id": "neurotransmitters", "num": "04", "tag": "NEUROTRANSMITTERS", "ru": {"title": "Нейромедиаторы: химический язык мозга", "question": "Как нейроны общаются друг с другом?", "lead": "Человеческий мозг содержит миллиарды нейронов, которые постоянно обмениваются информацией. Но нейроны не обязательно соединены друг с другом напрямую. Одним из важнейших способов коммуникации между ними является химическая передача сигнала.", "sections": [{"h": "Что происходит в синапсе?", "p": ["Синапс — специализированная область контакта между нейронами или между нейроном и другой клеткой.", "Когда электрический сигнал достигает окончания аксона, запускается последовательность событий: 1. Открываются потенциал-зависимые кальциевые каналы. 2. Ионы кальция поступают внутрь нервного окончания. 3. Синаптические пузырьки сливаются с мембраной. 4. Нейромедиатор выделяется в синаптическую щель. 5. Молекулы связываются с рецепторами следующей клетки.", "В результате активность следующей клетки может измениться."]}, {"h": "Четыре известных нейромедиатора", "p": ["Глутамат (glutamate). Главный возбуждающий нейромедиатор центральной нервной системы. Участвует в передаче сигналов и механизмах синаптической пластичности.", "ГАМК (GABA). Главный тормозный нейромедиатор взрослой центральной нервной системы. Помогает регулировать возбудимость нейронных сетей.", "Дофамин (dopamine). Участвует в обучении, мотивации, обработке вознаграждения и выборе действий. Его роль гораздо шире упрощённой идеи о том, что это просто «гормон удовольствия».", "Серотонин (serotonin). Участвует в регуляции различных процессов, включая настроение, сон, аппетит и обработку сенсорной информации."]}, {"h": "Почему одного нейромедиатора недостаточно?", "p": ["Представление о том, что один нейромедиатор отвечает за одну эмоцию или поведение, слишком упрощённо. Эффект зависит от типа рецептора, расположения клетки, особенностей нейронной сети и текущего физиологического состояния. Один и тот же нейромедиатор может оказывать разные эффекты в разных областях мозга."]}], "unknown": ["как нейромодуляторы координируют работу больших нейронных сетей", "каким образом изменения синаптической передачи связаны с обучением и поведением"], "main": "Мозг использует сложный химический язык, в котором значение сигнала определяется не только молекулой, но и контекстом её действия.", "keys": ["Синапс", "Нейромедиатор", "Рецептор", "Глутамат", "ГАМК", "Дофамин", "Серотонин"], "refs": [{"a": "Südhof T.C. (2013). Neurotransmitter release: the last millisecond in the life of a synaptic vesicle.", "j": "Neuron", "doi": "10.1016/j.neuron.2013.10.022"}, {"a": "Tricoire L., ~~Tina? Sabatini B.L. (2012). GABAergic signaling in the developing brain.", "j": "Current Opinion in Neurobiology", "doi": "10.1016/j.conb.2011.10.010"}], "status": "установлено с уточнениями"}, "en": {"title": "Neurotransmitters: the chemical language of the brain", "question": "How do neurons communicate with each other?", "lead": "The human brain contains billions of neurons constantly exchanging information. Neurons are not necessarily directly connected to each other. One of the most important ways they communicate is chemical signal transmission.", "sections": [{"h": "What happens in a synapse?", "p": ["A synapse is a specialized junction between neurons, or between a neuron and another cell.", "When an electrical signal reaches the axon terminal, a sequence unfolds: 1. Voltage-gated calcium channels open. 2. Calcium ions enter the nerve terminal. 3. Synaptic vesicles fuse with the membrane. 4. Neurotransmitter is released into the synaptic cleft. 5. Molecules bind to receptors on the next cell.", "As a result, the activity of the next cell can change."]}, {"h": "Four well-known neurotransmitters", "p": ["Glutamate. The main excitatory neurotransmitter of the central nervous system. Involved in signal transmission and mechanisms of synaptic plasticity.", "GABA. The main inhibitory neurotransmitter of the adult CNS. Helps regulate the excitability of neural networks.", "Dopamine. Involved in learning, motivation, reward processing, and action selection. Its role is far broader than the simplified idea of it being just a “pleasure hormone.”", "Serotonin. Involved in regulating various processes, including mood, sleep, appetite, and sensory processing."]}, {"h": "Why is one neurotransmitter not enough?", "p": ["The idea that one neurotransmitter maps to one emotion or behavior is too simplistic. The effect depends on receptor type, cell location, network properties, and the current physiological state. The same neurotransmitter can produce different effects in different brain areas."]}], "unknown": ["how neuromodulators coordinate large neural networks", "how changes in synaptic transmission relate to learning and behavior"], "main": "The brain uses a complex chemical language in which a signal's meaning depends not only on the molecule but on the context of its action.", "keys": ["Synapse", "Neurotransmitter", "Receptor", "Glutamate", "GABA", "Dopamine", "Serotonin"], "refs": [{"a": "Südhof T.C. (2013). Neurotransmitter release: the last millisecond in the life of a synaptic vesicle.", "j": "Neuron", "doi": "10.1016/j.neuron.2013.10.022"}, {"a": "Tricoire L., Sabatini B.L. (2012). GABAergic signaling in the developing brain.", "j": "Current Opinion in Neurobiology", "doi": "10.1016/j.conb.2011.10.010"}], "status": "established with refinements"}}, {"id": "methods", "num": "05", "tag": "RESEARCH METHODS", "ru": {"title": "Можем ли мы на самом деле видеть, как мозг думает?", "question": "Что показывают МРТ, фМРТ и ЭЭГ — и чего они не могут показать?", "lead": "Когда мы видим изображение мозга с яркими цветными областями, может возникнуть впечатление, будто учёные буквально наблюдают за мыслями человека. Но нейровизуализация гораздо сложнее.", "sections": [{"h": "Каждый метод регистрирует сигнал, а не мысли", "p": ["Каждый метод регистрирует определённый физиологический сигнал, а не мысли непосредственно."]}, {"h": "MRI: структура мозга", "p": ["Магнитно-резонансная томография использует сильное магнитное поле и радиочастотные импульсы для получения изображений внутренних структур организма.", "В нейровизуализации MRI позволяет исследовать анатомию мозга, различать ткани и выявлять структурные особенности."]}, {"h": "fMRI: изменения кровотока", "p": ["Функциональная МРТ часто основана на BOLD-сигнале — изменениях, связанных с соотношением кислородсодержащего и дезоксигенированного гемоглобина в крови. Когда активность определённых нейронных популяций меняется, локальная гемодинамическая реакция также может изменяться.", "Но здесь есть важный нюанс: BOLD-сигнал — косвенный показатель нейронной активности. Поэтому цветная область на фМРТ-изображении не означает, что учёные непосредственно увидели мысль или эмоцию."]}, {"h": "EEG: электрическая активность", "p": ["Электроэнцефалография регистрирует изменения электрического потенциала на поверхности головы. Она обладает высокой временной точностью: позволяет отслеживать изменения активности мозга в масштабе миллисекунд. Однако определить точное расположение источника сигнала по ЭЭГ значительно сложнее."]}, {"h": "Почему методы дополняют друг друга?", "p": ["У каждого метода есть ограничения.", "MRI хорошо показывает анатомическую структуру. fMRI помогает исследовать пространственное распределение гемодинамических изменений. EEG позволяет наблюдать быстрые изменения электрической активности. PET используется для исследования метаболических процессов и распределения определённых молекул с помощью радиофармпрепаратов.", "Выбор метода зависит от исследовательского вопроса."]}, {"h": "Главная проблема интерпретации", "p": ["Если определённая область активируется во время выполнения задачи, это ещё не доказывает, что именно она отвечает за эту функцию. Одна область может участвовать в нескольких процессах, а одна функция может обеспечиваться распределённой сетью. Это одна из причин, почему нейровизуализационные результаты необходимо интерпретировать осторожно."]}], "unknown": [], "main": "Нейровизуализация позволяет исследовать физиологические процессы мозга, но не даёт прямого доступа к содержанию человеческих мыслей.", "keys": ["МРТ", "фМРТ", "BOLD", "ЭЭГ", "ПЭТ", "Нейровизуализация", "Обратный вывод"], "refs": [{"a": "Logothetis N.K. (2008). What we can do and what we cannot do with fMRI.", "j": "Nature", "doi": "10.1038/nature06976"}, {"a": "Poldrack R.A. (2006). Can cognitive processes be inferred from neuroimaging data?", "j": "Trends in Cognitive Sciences", "doi": "10.1016/j.tics.2005.12.004"}], "status": "установлено с уточнениями"}, "en": {"title": "Can we actually see the brain think?", "question": "What do MRI, fMRI and EEG show — and what can they not show?", "lead": "When we see a brain image with bright colored areas, it can seem as if scientists are literally watching a person's thoughts. But neuroimaging is far more subtle.", "sections": [{"h": "Each method records a signal, not thoughts", "p": ["Each method registers a specific physiological signal — not thoughts directly."]}, {"h": "MRI: brain structure", "p": ["Magnetic resonance imaging uses a strong magnetic field and radiofrequency pulses to image internal structures.", "In neuroimaging, MRI makes it possible to study brain anatomy, distinguish tissues, and detect structural features."]}, {"h": "fMRI: blood-flow changes", "p": ["Functional MRI often relies on the BOLD signal — changes related to the ratio of oxygenated and deoxygenated hemoglobin in the blood. When the activity of certain neural populations changes, the local hemodynamic response can change too.", "But there is an important caveat: the BOLD signal is an indirect measure of neural activity. So a colored area on an fMRI image does not mean scientists directly saw a thought or an emotion."]}, {"h": "EEG: electrical activity", "p": ["Electroencephalography records changes in electrical potential on the surface of the head. It has high temporal resolution: it tracks brain activity changes at the millisecond scale. However, pinpointing the exact source of the signal from EEG is much harder."]}, {"h": "Why the methods complement each other", "p": ["Each method has limitations.", "MRI shows anatomical structure well. fMRI helps study the spatial distribution of hemodynamic changes. EEG captures fast changes in electrical activity. PET is used to study metabolic processes and the distribution of specific molecules via radiotracers.", "Method choice depends on the research question."]}, {"h": "The main interpretation problem", "p": ["If an area activates during a task, that does not prove it is responsible for that function. One area can participate in several processes, and one function can be supported by a distributed network. This is one reason neuroimaging results must be interpreted carefully."]}], "unknown": [], "main": "Neuroimaging lets us study the brain's physiological processes, but it gives no direct access to the content of human thoughts.", "keys": ["MRI", "fMRI", "BOLD", "EEG", "PET", "Neuroimaging", "Reverse inference"], "refs": [{"a": "Logothetis N.K. (2008). What we can do and what we cannot do with fMRI.", "j": "Nature", "doi": "10.1038/nature06976"}, {"a": "Poldrack R.A. (2006). Can cognitive processes be inferred from neuroimaging data?", "j": "Trends in Cognitive Sciences", "doi": "10.1016/j.tics.2005.12.004"}], "status": "established with refinements"}}, {"id": "perception", "num": "06", "tag": "COGNITION & PERCEPTION", "ru": {"title": "Показывает ли вам ваш мозг реальность — или конструирует её?", "question": "Почему наше восприятие не является точной копией окружающего мира?", "lead": "Мы привыкли считать, что видим мир таким, какой он есть. Но зрение, слух и другие сенсорные системы не передают в мозг готовую картину реальности. Они передают сигналы, которые мозг должен обработать и интерпретировать. Восприятие — активный процесс.", "sections": [{"h": "От сигнала к восприятию", "p": ["Когда свет попадает на сетчатку глаза, фоторецепторы преобразуют его в электрические сигналы. Далее информация проходит через несколько уровней зрительной системы и обрабатывается различными нейронными сетями. Одни нейроны чувствительны к определённым характеристикам изображения, другие участвуют в более сложной обработке формы, движения и пространственных отношений.", "В результате возникает субъективное зрительное восприятие."]}, {"h": "Почему мозг использует ожидания?", "p": ["Мозг обрабатывает не только поступающую сенсорную информацию, но и контекст, прошлый опыт и ожидания. Например, если изображение частично закрыто, мы часто воспринимаем объект целиком, хотя часть информации физически отсутствует. Это показывает, что восприятие включает интерпретацию неполных данных.", "Некоторые современные модели описывают этот процесс через predictive processing — подход, согласно которому мозг использует внутренние модели для прогнозирования сенсорных сигналов и обновляет их при расхождении с поступающей информацией. Однако predictive processing — широкое теоретическое направление, а не окончательно доказанное универсальное объяснение всей работы мозга."]}, {"h": "Внимание: почему мы замечаем не всё?", "p": ["Даже если информация поступает в сенсорную систему, это не означает, что она одинаково доступна сознательному восприятию. Внимание помогает выделять часть информации и усиливать её обработку. Оно зависит от целей, контекста, неожиданности и значимости стимула. Именно поэтому человек может не заметить очевидный объект, если его внимание сосредоточено на другой задаче."]}], "unknown": ["как именно мозг объединяет сенсорные сигналы, ожидания, внимание и память в единый субъективный опыт", "почему одинаковые стимулы могут восприниматься по-разному разными людьми", "каким образом нейронная обработка связана с сознательным переживанием"], "main": "Мы не просто получаем информацию об окружающем мире — мозг постоянно интерпретирует её.", "keys": ["Восприятие", "Внимание", "Зрительная кора", "Predictive processing", "Сенсорная интеграция", "Когнитивный уклон"], "refs": [{"a": "Carrasco M. (2011). Visual attention: The past 25 years.", "j": "Vision Research", "doi": "10.1016/j.visres.2011.04.012"}, {"a": "Summerfield C., de Lange F.P. (2014). Expectation in perceptual decision making.", "j": "Nature Reviews Neuroscience", "doi": "10.1038/nrn3838"}], "status": "активно исследуется"}, "en": {"title": "Does your brain show you reality — or construct it?", "question": "Why is our perception not an exact copy of the world?", "lead": "We tend to assume we see the world as it is. But vision, hearing, and other sensory systems do not deliver a ready-made picture of reality to the brain. They deliver signals that the brain must process and interpret. Perception is an active process.", "sections": [{"h": "From signal to perception", "p": ["When light hits the retina, photoreceptors convert it into electrical signals. The information then passes through several levels of the visual system and is processed by different neural networks. Some neurons are sensitive to specific image features; others take part in more complex processing of form, motion, and spatial relations.", "Subjective visual perception arises as a result."]}, {"h": "Why the brain uses expectations", "p": ["The brain processes not only incoming sensory information but also context, past experience, and expectations. For example, when an image is partly occluded, we often perceive the object as whole even though part of the information is physically missing. This shows that perception involves interpreting incomplete data.", "Some modern models describe this process through predictive processing — an approach in which the brain uses internal models to predict sensory signals and updates them when predictions mismatch input. However, predictive processing is a broad theoretical framework, not a definitively proven universal explanation of how the brain works."]}, {"h": "Attention: why we don't notice everything", "p": ["Even if information reaches a sensory system, that does not mean it is equally available to conscious perception. Attention helps select part of the information and amplifies its processing. It depends on goals, context, surprise, and stimulus salience. That is why a person can miss an obvious object when their attention is focused on another task."]}], "unknown": ["how exactly the brain integrates sensory signals, expectations, attention and memory into a single subjective experience", "why identical stimuli can be perceived differently by different people", "how neural processing relates to conscious experience"], "main": "We do not simply receive information about the world — the brain constantly interprets it.", "keys": ["Perception", "Attention", "Visual cortex", "Predictive processing", "Sensory integration", "Cognitive bias"], "refs": [{"a": "Carrasco M. (2011). Visual attention: The past 25 years.", "j": "Vision Research", "doi": "10.1016/j.visres.2011.04.012"}, {"a": "Summerfield C., de Lange F.P. (2014). Expectation in perceptual decision making.", "j": "Nature Reviews Neuroscience", "doi": "10.1038/nrn3838"}], "status": "actively researched"}}, {"id": "plasticity", "num": "07", "tag": "NEUROPLASTICITY", "ru": {"title": "Меняющийся мозг: как опыт перестраивает нейронные связи", "question": "Может ли мозг физически меняться под влиянием опыта?", "lead": "Мозг не является неизменной структурой. Его нейронные сети способны адаптироваться под влиянием обучения, опыта, окружающей среды и восстановления после некоторых повреждений. Эта способность называется нейропластичностью.", "sections": [{"h": "Но что именно меняется?", "p": ["Пластичность на уровне синапсов. Нейроны взаимодействуют через синапсы. Эффективность передачи сигнала между ними может изменяться в зависимости от характера активности.", "Один из наиболее изученных механизмов — долговременная потенциация (LTP). При определённых условиях синаптическая передача становится более эффективной на продолжительное время. Другой механизм — долговременная депрессия (LTD), при которой эффективность синаптической передачи снижается. Оба процесса важны для регулирования нейронных сетей."]}, {"h": "Роль NMDA и AMPA-рецепторов", "p": ["Глутаматные рецепторы AMPA и NMDA играют важную роль в некоторых формах синаптической пластичности. AMPA-рецепторы участвуют в быстрой возбуждающей передаче сигнала.", "NMDA-рецепторы обладают особыми свойствами: их активация зависит не только от связывания глутамата, но и от состояния мембраны. При определённых условиях через них поступает кальций, запускающий внутриклеточные процессы, которые могут изменять силу синапса. Так нейронная активность может приводить к долговременным изменениям в работе соединений между клетками."]}, {"h": "Нейропластичность — не только обучение", "p": ["Изменения в нервной системе происходят на разных уровнях: функциональном — меняется эффективность взаимодействия нейронов; структурном — могут изменяться дендритные шипики и другие элементы нейронов; сетевом — меняется взаимодействие между областями мозга.", "Нейропластичность участвует в обучении и адаптации, но также может быть связана с неэффективными или патологическими изменениями. Поэтому пластичность не всегда означает улучшение."]}, {"h": "Есть ли у нейропластичности пределы?", "p": ["Да. Способность мозга меняться зависит от возраста, типа навыка, состояния нервной системы, особенностей обучения и множества других факторов. Нельзя утверждать, что человек может без ограничений изменить любые способности исключительно за счёт тренировок."]}], "unknown": [], "main": "Мозг постоянно адаптирует свои нейронные связи. Обучение — один из процессов, посредством которых опыт оставляет физический след в нервной системе.", "keys": ["Нейропластичность", "LTP", "LTD", "NMDA", "AMPA", "Синаптическое ремоделирование", "Обучение"], "refs": [{"a": "Bliss T.V.P., Collingridge G.L. (1993). A synaptic model of memory: long-term potentiation in the hippocampus.", "j": "Nature", "doi": "10.1038/361031a0"}, {"a": "Citri A., Malenka R.C. (2008). Synaptic plasticity: multiple forms, functions, and mechanisms.", "j": "Neuropsychopharmacology", "doi": "10.1038/sj.npp.1301559"}], "status": "установлено с уточнениями"}, "en": {"title": "The changing brain
