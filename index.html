": "Brain tumors: understanding the biology of abnormal cell growth", "question": "How do scientists study tumors of the central nervous system?", "lead": "The brain is a complex system of neurons, glial cells, vessels, and many other cellular components. Like other tissues, the nervous system can face disruptions in the mechanisms of cell growth and division. One such condition is tumors of the central nervous system.", "sections": [{"h": "What is a tumor?", "p": ["A tumor arises from pathological cell proliferation in which normal growth regulation is disrupted. Tumors of the central nervous system differ in origin, molecular characteristics, location, and biological behavior. Some are associated with glial cells; others have different cellular origins.", "It is important to understand that “brain tumor” unites many biologically distinct diseases."]}, {"h": "Why cell origin matters", "p": ["Neurons and glial cells perform different functions. Glial cells help maintain the neural environment, form myelin, regulate synaptic activity, and take part in immune processes of the nervous system.", "Studying tumors therefore requires understanding cell biology and the molecular mechanisms that regulate cell division and differentiation."]}, {"h": "How tumors are classified", "p": ["The modern World Health Organization classification takes into account not only how cells look under a microscope but also the molecular-genetic characteristics of the tumor. This is an important shift in neuro-oncology: two tumors that look similar under routine tissue examination can differ molecularly and belong to different diagnostic categories.", "The WHO CNS5 classification uses integrated diagnostic approaches combining histological and molecular data."]}, {"h": "Why this matters for neuroscience", "p": ["Studying tumors helps us better understand: mechanisms of cell division; genetic changes; how cells interact with surrounding tissue; the role of molecular signaling pathways; features var LANG=localStorage.getItem("nn_lang")||"ru";
if(["ru","en","ko","ja"].indexOf(LANG)<0)LANG="ru";

function t(k){var v=D.i18n[k];if(!v)return k;return v[LANG]||v.en||v.ru;}
function C(o){ // content: returns {t,fb}
  if(!o)return{t:"",fb:false};
  if(o[LANG])return{t:o[LANG],fb:false};
  if(o.en)return{t:o.en,fb:LANG!=="en"};
  return{t:o.ru||"",fb:LANG!=="ru"};
}
function fb(){var f=C(D.i18n.fallback_note);return f.fb?"<div class='fb'>"+f.t+"</div>":"";}

function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.innerHTML=t(e.getAttribute("data-i18n"));});
  document.querySelectorAll(".langs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===LANG);});
  ["home","quiz","lib","lab","open","stats","about"].forEach(function(s){var e=document.getElementById("n_"+s);if(e)e.innerHTML=t(s==="home"?"nav_home":s==="quiz"?"nav_quiz":s==="lib"?"nav_lib":s==="lab"?"nav_lab":s==="open"?"nav_open":s==="stats"?"nav_stats":"nav_about");});
  document.getElementById("footnote").innerHTML="NEURONEURO · "+LANG.toUpperCase()+" · 2026";
  renderAll();
}
function nav(sec){
  document.querySelectorAll("main section").forEach(function(s){s.classList.toggle("on",s.id===sec);});
  document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-nav")===sec);});
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var n=e.target.closest("[data-nav]");
  if(n){e.preventDefault();nav(n.getAttribute("data-nav"));return;}
  var l=e.target.closest("[data-l]");
  if(l){LANG=l.getAttribute("data-l");localStorage.setItem("nn_lang",LANG);stopTimer();applyI18n();return;}
});

var qz=null,qi=0,qscore=0,qans=false,qtimer=null,qleft=30;
function renderQuizList(){
  var h="<div class='grid g2'>";
  D.quiz.forEach(function(q,i){
    var ttl=C(q.title);
    h+="<div class='card' data-qz='"+i+"'><span class='num'>"+(i+1)+"</span><h3>"+ttl.t+"</h3><p class='mut'>"+q.qs.length+" "+(LANG==="ru"?"вопросов":LANG==="ko"?"질문":LANG==="ja"?"問":"questions")+"</p></div>";
  });
  h+="</div>";
  document.getElementById("quizlist").innerHTML=h;
  document.getElementById("quizlist").style.display="";
  document.getElementById("quizrun").style.display="none";
}
document.addEventListener("click",function(e){
  var c=e.target.closest("[data-qz]");
  if(c){startQuiz(D.quiz[+c.getAttribute("data-qz")]);}
});
function startQuiz(q){
  qz=q;qi=0;qscore=0;qans=false;stopTimer();
  document.getElementById("quizlist").style.display="none";
  var r=document.getElementById("quizrun");r.style.display="block";
  r.innerHTML="<button class='btn ghost' data-nav='quiz'>&larr; "+t("quiz_back")+"</button><div id='qbody' style='margin-top:16px'></div>";
  renderQ();
}
function stopTimer(){if(qtimer){clearInterval(qtimer);qtimer=null;}}
function renderQ(){
  stopTimer();qans=false;qleft=30;
  var q=qz.qs[qi],txt=C(q.q),expl=C(q.expl),note=fb();
  var h="<div class='progress'><i style='width:"+Math.round(qi/qz.qs.length*100)+"%'></i></div>";
  h+="<p class='mut'>"+t("quiz_q")+" "+(qi+1)+" / "+qz.qs.length+"<span class='timer' id='tmr'></span></p>";
  h+="<h2>"+txt.t+"</h2>"+note;
  h+="<div id='opts'></div><div class='expl' id='expl'><b id='verdict'></b><p id='exptext'></p></div>";
  h+="<div style='margin-top:14px'><button class='btn' id='nextbtn' style='display:none'>"+(qi+1<qz.qs.length?t("quiz_next"):t("quiz_finish"))+"</button></div>";
  document.getElementById("qbody").innerHTML=h;
  var ob=document.getElementById("opts");
  q.opts.forEach(function(o,oi){
    var oc=C(o),b=document.createElement("button");
    b.className="opt";b.textContent=oc.t;
    b.onclick=function(){answer(oi);};
    ob.appendChild(b);
  });
  updTimer();
  qtimer=setInterval(function(){qleft--;updTimer();if(qleft<=0){stopTimer();reveal(-1);}},1000);
  document.getElementById("nextbtn").onclick=function(){qi++;if(qi<qz.qs.length)renderQ();else result();};
}
function updTimer(){var e=document.getElementById("tmr");if(e)e.textContent="⏱ "+qleft+" s";}
function answer(i){if(qans)return;stopTimer();reveal(i);}
function reveal(pick){
  qans=true;
  var q=qz.qs[qi],ok=pick===q.correct;
  if(ok)qscore++;
  var bs=document.querySelectorAll("#opts .opt");
  bs.forEach(function(b,bi){
    b.disabled=true;
    if(bi===q.correct)b.classList.add("ok");
    else if(bi===pick)b.classList.add("bad");
  });
  var v=document.getElementById("verdict"),xt=document.getElementById("exptext"),ex=C(q.expl);
  v.textContent=ok?t("quiz_correct"):t("quiz_wrong");
  v.style.color=ok?"var(--acc2)":"var(--bad)";
  xt.textContent=ex.t;
  document.getElementById("expl").classList.add("show");
  document.getElementById("nextbtn").style.display="inline-block";
  if(qleft<=0&&pick<0){v.textContent="⏱";v.style.color="var(--warn)";}
}
function result(){
  var pct=Math.round(qscore/qz.qs.length*100);
  var note=t("quiz_note");
  document.getElementById("qbody").innerHTML=
    "<div style='text-align:center;padding:20px 0'><div class='big'>"+qscore+" / "+qz.qs.length+"</div>"+
    "<p class='mut'>"+pct+"%</p><p style='margin:18px 0'>"+note+"</p>"+
    "<button class='btn' id='again'>"+t("quiz_again")+"</button> <button class='btn ghost' data-nav='quiz'>"+t("quiz_back")+"</button></div>";
  document.getElementById("again").onclick=function(){startQuiz(qz);};
  bump("quizDone");
}

    document.getElementById("braininfo").innerHTML="<b>"+n.t+"</b><p>"+dd.t+"</p><p class='mut'><b style='color:var(--warn)'>"+t("lab_why")+":</b> "+w.t+"</p>"+fb();
    document.querySelectorAll("#brainmap .dot").forEach(function(d){d.style.background="";d.style.borderColor="";});
    c.style.background="var(--acc)";return;
  }
  var g=e.target.closest("[data-n]");
  if(g){
    var b2=D.lab.nerv[+g.getAttribute("data-n")],n2=C(b2.n),d2=C(b2.d);
    document.getElementById("nervinfo").innerHTML="<b>"+n2.t+"</b><p>"+d2.t+"</p>"+fb();
    return;
  }
});
function renderNerv(){
  var m=document.getElementById("nervmap"),h="";
  h+="<svg viewBox='0 0 100 100' preserveAspectRatio='none' style='position:absolute;inset:0;width:100%;height:100%'>";
  h+="<circle cx='50' cy='12' r='9' fill='none' stroke='#4a4234' stroke-width='0.7'/>";
  h+="<path d='M50,21 L50,64 M50,30 L28,44 M50,30 L72,44 M50,64 L36,92 M50,64 L64,92' stroke='#4a4234' stroke-width='0.9' fill='none' stroke-linecap='round'/>";
  h+="<path d='M50,24 L50,62' stroke='#4dd07a' stroke-width='0.5' fill='none'/>";
  h+="</svg>";
  D.lab.nerv.forEach(function(b,i){
    h+="<div class='dot g' data-n='"+i+"' style='left:"+b.x+"%;top:"+b.y+"%'></div>";
  });
  m.innerHTML=h;
  document.getElementById("nervinfo").innerHTML="<span class='mut'>"+t("click_hint")+"</span>";
}
/* ---------- STROOP ---------- */
var stOn=false,stRound=0,stT=[],stStart=0;
var STROOP={ru:["КРАСНЫЙ","ЗЕЛЁНЫЙ","СИНИЙ","ЖЁЛТЫЙ"],en:["RED","GREEN","BLUE","YELLOW"],ko:["빨강","초록","파랑","노랑"],ja:["赤","緑","青","黄色"]};
var STCOL=["#ff4d4d","#4dd07a","#4d8dff","#ffd84d"];
document.getElementById("stroopbtn").onclick=function(){
  stOn=true;stRound=0;stT=[];
  this.style.display="none";
  document.getElementById("stroopbox").style.display="block";
  document.getElementById("stres").textContent="";
  stNext();
};
function stNext(){
  stRound++;
  if(stRound>10){stEnd();return;}
  var words=STROOP[LANG]||STROOP.en;
  var wi=Math.floor(Math.random()*4),ci=Math.floor(Math.random()*4);
  document.getElementById("stword").textContent=words[wi];
  document.getElementById("stword").style.color=STCOL[ci];
  var bts=document.getElementById("stbtns");bts.innerHTML="";
  STCOL.forEach(function(cl,i){
    var b=document.createElement("button");
    b.className="opt";b.style.display="inline-block";b.style.width="auto";b.style.padding="10px 18px";b.style.margin="4px";
    b.innerHTML="<span style='color:"+cl+";font-weight:bold'>■</span> <span style='color:"+cl+"'>"+words[i]+"</span>";
    b.onclick=function(){stT.push(Date.now()-stStart);stNext();};
    bts.appendChild(b);
  });
  stStart=Date.now();
}
function stEnd(){
  document.getElementById("stword").textContent="";
  document.getElementById("stbtns").innerHTML="";
  var avg=Math.round(stT.reduce(function(a,b){return a+b;},0)/stT.length);
  document.getElementById("stres").textContent=t("stroop_done")+" "+avg+" "+t("stroop_ms");
  var bb=document.getElementById("stroopbtn");bb.style.display="inline-block";bb.innerHTML=t("stroop_again");
  bump("stroop");
}
/* ---------- QUESTIONNAIRE ---------- */
function renderQuest(){
  var h="";
  D.lab.quest.forEach(function(q,i){
    var s=C(q.s);
    h+="<div style='margin:14px 0'><div>"+(i+1)+". "+s.t+"</div><input type='range' class='slider' min='1' max='5' value='3' data-q='"+i+"'><div class='scale'>1 · 2 · 3 · 4 · 5</div></div>";
  });
  document.getElementById("questbox").innerHTML=h;
  document.getElementById("qres").style.display="none";
}
document.getElementById("qcalc").onclick=function(){
  var vals=document.querySelectorAll("#questbox input"),sum=0;
  vals.forEach(function(v){
    var q=D.lab.quest[+v.getAttribute("data-q")],x=+v.value;
    sum+=q.rev?(6-x):x;
  });
  var lvl=sum<=22?2:(sum<=34?1:0),r=D.lab.quest_res[lvl],n=C(r.n),d=C(r.d);
  document.getElementById("qres").innerHTML="<b>"+n.t+"</b><p>"+d.t+"</p>"+fb();
  document.getElementById("qres").style.display="block";
  bump("quest");
};
/* ---------- OPEN QUESTIONS ---------- */
function renderOpen(){
  var h="";
  D.lab.openq.forEach(function(o){
    var tt=C(o.t),dd=C(o.d);
    h+="<details class='oq'><summary>"+tt.t+"</summary><div class='b'><p>"+dd.t+"</p></div></details>";
  });
  document.getElementById("openlist").innerHTML=h;
}
/* ---------- STATS ---------- */
function bump(k){try{var n=+localStorage.getItem("nn_"+k)||0;localStorage.setItem("nn_"+k,n+1);}catch(e){}}
function renderStats(){
  var g=function(k){var n=0;try{n=+localStorage.getItem("nn_"+k)||0;}catch(e){}return n;};
  var items=[
    [D.art.length,{ru:"статей",en:"articles",ko:"기사",ja:"記事"}],
    [21,{ru:"вопросов в квизах",en:"quiz questions",ko:"퀴즈 질문",ja:"クイズ問題"}],
    [12,{ru:"областей мозга",en:"brain areas",ko:"뇌 영역",ja:"脳領域"}],
    [4,{ru:"языка",en:"languages",ko:"개 언어",ja:"言語"}]
  ];
  var h="";
  items.forEach(function(it){
    var lbl=C(it[1]);
    h+="<div class='stat'><b>"+it[0]+"</b><span class='mut'>"+lbl.t+"</span></div>";
  });
  document.getElementById("statboxes").innerHTML=h;
  var vis=[[g("quizDone"),{ru:"Квизы пройдены",en:"Quizzes done",ko:"퀴즈 완료",ja:"クイズ完了"}],[g("stroop"),{ru:"Струп-тесты",en:"Stroop runs",ko:"스트룹 실행",ja:"ストループ実行"}],[g("quest"),{ru:"Опросники",en:"Checklists",ko:"설문",ja:"チェックリスト"}]];
  var max=Math.max(1,vis.map(function(v){return v[0];}).reduce(function(a,b){return Math.max(a,b);}));
  var ch="";
  vis.forEach(function(v){
    var lbl=C(v[1]);
    ch+="<div class='bar' style='height:"+Math.max(4,Math.round(v[0]/max*100))+"%'><b>"+v[0]+"</b><span>"+lbl.t+"</span></div>";
  });
  document.getElementById("chart").innerHTML=ch;
}
/* ---------- RENDER ALL ---------- */
function renderAll(){
  renderQuizList();
  renderArticles();
  renderBrain();
  renderNerv();
  renderQuest();
  renderOpen();
  renderStats();
  var r=document.getElementById("stroopbtn");r.innerHTML=t("stroop_start");
  document.getElementById("stroopbox").style.display="none";
}
applyI18n();
</script>
